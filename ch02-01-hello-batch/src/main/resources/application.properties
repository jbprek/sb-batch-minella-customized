# use an in-memory H2 DB for Spring Batch
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# enable H2 console (optional)
spring.h2.console.enabled=false

# ensure SQL initialization runs
spring.sql.init.mode=always

# force Spring Batch to initialize its schema
spring.batch.jdbc.initialize-schema=always

# Additional configuration for Spring Boot 3.x
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.defer-datasource-initialization=true

# Logging to see what's happening
#logging.level.org.springframework.batch=DEBUG
#logging.level.org.springframework.jdbc=DEBUG

