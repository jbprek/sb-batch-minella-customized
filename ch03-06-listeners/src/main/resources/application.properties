spring.mail.host=smtp.noop.com
spring.mail.port=587
spring.mail.username=admin@noop.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=jdbc:mysql://localhost:3306/batchdb
spring.datasource.username=batchuser
spring.datasource.password=batchuser

spring.batch.jdbc.initialize-schema=never

# Logging to see what's happening
logging.level.org.springframework.batch=DEBUG
logging.level.org.springframework.jdbc=DEBUG

